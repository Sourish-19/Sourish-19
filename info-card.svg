<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 320" width="490" height="320">
<style>
  .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 6px; }
  .title-bar { fill: #161b22; rx: 6px 6px 0 0; }
  .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12px; fill: #8b949e; font-weight: 600; }
  .dot { r: 5.5px; }
  .dot-red { fill: #ff5f56; }
  .dot-yellow { fill: #ffbd2e; }
  .dot-green { fill: #27c93f; }
  .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11.5px; }
  .key { font-weight: 600; fill: #58a6ff; }
  .separator { fill: #8b949e; }
  @keyframes lineIn {
    0% { opacity: 0; transform: translateX(-8px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  .animated-line { opacity: 0; animation: lineIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
</style>
